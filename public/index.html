<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Destiny Depends on You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>

<body>  
  <!-- Header -->
  <header id="header-container">
    <!-- Header content loaded dynamically -->
  </header>
  <script>
    fetch('header.html')
      .then(response => response.text())
      .then(data => document.getElementById('header-container').innerHTML = data)
      .catch(error => console.error('Error loading header:', error));
  </script>

  <!-- Main Content -->
  <section class="home interactive-background">
    <div class="overlay">
      <h1 class="title animate__animated animate__fadeIn">Your Destiny Depends on You</h1>
      <div class="interactive-boxes">
        <div class="box animate__animated animate__zoomIn">
          <h2>Start Playing Now</h2>
          <button onclick="location.href='menu.html'" class="btn btn-primary animate__animated animate__pulse animate__infinite">
            Go to Menu <i class="fas fa-play"></i>
          </button>
        </div>
        <div class="box animate__animated animate__zoomIn">
          <h2>How is the Game?</h2>
          <p>It's an interactive experience where your choices define the story!</p>
        </div>
        <div class="box animate__animated animate__zoomIn">
          <h2>How to Play?</h2>
          <p>Navigate through the story by making choices. Each decision shapes your journey.</p>
        </div>
        <div class="box animate__animated animate__zoomIn">
          <h2>Share you Feedback!</h2>
          <a href="contacts.html" class="link">Contact Us</a>
        </div>
      </div>
    </div>
    <div class="video-background">
      <video autoplay muted loop>
        <source src="videos/homevideo.mp4" type="video/mp4">
      </video>
    </div>
  </section>

  <!-- Footer -->
  <footer id="footer-container">
    <!-- Footer content loaded dynamically -->
  </footer>
  <script>
    fetch('footer.html')
      .then(response => response.text())
      .then(data => document.getElementById('footer-container').innerHTML = data)
      .catch(error => console.error('Error loading footer:', error));
  </script>
</body>

</html>
