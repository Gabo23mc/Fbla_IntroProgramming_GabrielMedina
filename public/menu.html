<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose your way</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>

<body>
  <!-- Header -->
  <header id="header-container">
    <!-- Header content loaded dynamically -->
  </header>
  <script>
    fetch('header.html')
      .then(response => response.text())
      .then(data => document.getElementById('header-container').innerHTML = data)
      .catch(error => console.error('Error loading header:', error));
  </script>

  <!-- Main Content -->
  <section class="menu interactive-background">
    <div class="overlay">
      <h1 class="title animate__animated animate__fadeInDown">Choose Your Destination</h1>
      <div class="menu-items">
        <div class="menu-item animate__animated animate__zoomIn">
          <h3>City</h3>
          <p>Try the cool, big and scandalous city.</p>
          <button onclick="location.href='city.html'" class="btn btn-primary">Play City Game</button>
        </div>
        <div class="menu-item animate__animated animate__zoomIn">
          <h3>Forest</h3>
          <p>Suspense is how you describe the deep forest.</p>
          <button onclick="location.href='forest.html'" class="btn btn-success">Play Forest Game</button>
        </div>
        <div class="menu-item animate__animated animate__zoomIn">
          <h3>Space Adventure</h3>
          <p>Embark on an epic intergalactic mission.</p>
          <button onclick="location.href='space.html'" class="btn btn-warning">Play My Space-Story</button>
        </div>
        <div class="menu-item animate__animated animate__zoomIn">
          <h3>Park Adventure</h3>
          <p>Embark on an epic park mission.</p>
          <button onclick="location.href='park.html'" class="btn btn-warning">Play My Park-Story</button>
        </div>
      </div>
    </div>
    <div class="stars-bg">
      <!-- Puedes generar más divs .star para más estrellas -->
      <div class="star" style="top:10%;left:20%;width:2px;height:2px;animation-delay:0s;"></div>
      <div class="star" style="top:30%;left:70%;width:3px;height:3px;animation-delay:1s;"></div>
      <div class="star" style="top:60%;left:40%;width:1.5px;height:1.5px;animation-delay:0.5s;"></div>
      <div class="star" style="top:80%;left:80%;width:2.5px;height:2.5px;animation-delay:1.2s;"></div>
      <div class="star" style="top:50%;left:10%;width:2px;height:2px;animation-delay:0.8s;"></div>
      <div class="star" style="top:15%;left:90%;width:1.2px;height:1.2px;animation-delay:0.3s;"></div>
      <div class="star" style="top:75%;left:60%;width:2.8px;height:2.8px;animation-delay:1.5s;"></div>
      <!-- ...agrega más si quieres -->
    </div>
    
    <div class="video-background">
      <video autoplay muted loop>
        <source src="videos/menuvideo.mp4" type="video/mp4">
      </video>
    </div>
  </section>

  <!-- React Integration -->
  <div id="storyProgress"></div>
  <div id="react-root"></div>

  <!-- Footer -->
  <footer id="footer-container">
    <!-- Footer content loaded dynamically -->
  </footer>
  <script>
    fetch('footer.html')
      .then(response => response.text())
      .then(data => document.getElementById('footer-container').innerHTML = data)
      .catch(error => console.error('Error loading footer:', error));
  </script>

  <script src="forest.js"></script>
  <script>
    import('../src/index.jsx').catch(error => console.error('Error cargando React:', error));
  </script></body>

</html>
